<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" fill="none">
  <!-- Sun Rays (7 radiating rays in golden amber) -->
  <g stroke="#d99f36" stroke-width="6" stroke-linecap="round">
    <!-- Ray 1: far left -->
    <line x1="125" y1="130" x2="160" y2="135" />
    <!-- Ray 2: mid-left -->
    <line x1="155" y1="85" x2="182" y2="100" />
    <!-- Ray 3: upper mid-left -->
    <line x1="200" y1="52" x2="216" y2="76" />
    <!-- Ray 4: top center -->
    <line x1="250" y1="40" x2="250" y2="70" />
    <!-- Ray 5: upper mid-right -->
    <line x1="300" y1="52" x2="284" y2="76" />
    <!-- Ray 6: mid-right -->
    <line x1="345" y1="85" x2="318" y2="100" />
    <!-- Ray 7: far right -->
    <line x1="375" y1="130" x2="340" y2="135" />
  </g>

  <!-- Green Leaf / Seed Body -->
  <!-- Top Bud in Golden Amber -->
  <circle cx="250" cy="160" r="5.5" fill="#d99f36" />

  <!-- Symmetrical Organic Leaf -->
  <path d="M250 165 C285 200 292 250 250 280 C208 250 215 200 250 165 Z" fill="#244d3d" />

  <!-- Center Gold Vein & Stem -->
  <path d="M250 168 Q258 220 250 280 C246 292 238 296 215 296" stroke="#d99f36" stroke-width="5" stroke-linecap="round" fill="none" />

  <!-- Main Title: SIDDHI FARMS -->
  <text x="250" y="360" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-weight="700" font-size="44" letter-spacing="4" fill="#244d3d">
    SIDDHI FARMS
  </text>

  <!-- Subtitle: FARM & RESORT · PUNE -->
  <text x="250" y="395" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-weight="600" font-size="14" letter-spacing="6" fill="#b77c4e">
    FARM &amp; RESORT · PUNE
  </text>
</svg>
